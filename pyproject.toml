[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-cashflow-agent"
version = "0.1.2"
description = "Auditable infrastructure cash-flow forecasting with a bounded agent harness"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Dmitry Kazakov"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
publication = ["matplotlib>=3.7", "python-docx>=1.1"]

[project.urls]
Repository = "https://github.com/dmkkazakov/-infra-cashflow-agent"
Issues = "https://github.com/dmkkazakov/-infra-cashflow-agent/issues"

[project.scripts]
infra-cashflow = "infra_cashflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

