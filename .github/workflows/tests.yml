name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_release.py
      - run: python -m infra_cashflow demo --output outputs/demo --simulations 200
      - run: python -m infra_cashflow evaluate examples/demo_project.json --output outputs/evaluation.json
